version: 0.2

env:
  variables:
    AWS_REGION: "us-east-2"
    REPO_URI: "010928197218.dkr.ecr.us-east-2.amazonaws.com/tondase-ecs-repo"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 010928197218.dkr.ecr.us-east-2.amazonaws.com
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION

  build:
    commands:
      - echo Build started on `date`
      - echo Building Docker image...
      - docker build -t $REPO_URI:$IMAGE_TAG .
      - echo Pushing image to ECR...
      - docker push $REPO_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Build completed on `date`
      - printf '[{"name":"tondase-app","imageUri":"%s"}]' "$REPO_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
